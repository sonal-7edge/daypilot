name: Deploy to Render

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy daypilot API
        run: curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"

      - name: Deploy daypilot MCP server
        run: curl -X POST "${{ secrets.RENDER_MCP_DEPLOY_HOOK_URL }}"
