services:
  # ── Main API server ──────────────────────────────────────────────────────
  - type: web
    name: daypilot
    env: node
    region: singapore
    buildCommand: cd server && npm install
    startCommand: cd server && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JIRA_BASE_URL
        sync: false
      # Per-user credentials are now delivered via x-daypilot-token header.
      # The vars below are only needed for single-user / local-dev fallback.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REFRESH_TOKEN
        sync: false
      - key: GOOGLE_CALENDAR_ID
        sync: false
      - key: JIRA_EMAIL
        sync: false
      - key: JIRA_API_TOKEN
        sync: false
      - key: TEMPO_API_TOKEN
        sync: false
      - key: TEMPO_ACCOUNT_ID
        sync: false
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false

  # ── MCP server ───────────────────────────────────────────────────────────
  - type: web
    name: daypilot-mcp
    runtime: node
    region: singapore
    buildCommand: cd mcp && npm install
    startCommand: cd mcp && npm start
    envVars:
      - key: NODE_ENV
        value: production
      # URL of the main daypilot API service above.
      # Set this to: https://daypilot.onrender.com  (your actual Render URL)
      - key: DAYPILOT_API_URL
        sync: false
